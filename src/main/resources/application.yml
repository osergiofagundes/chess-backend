server:
  # 8080 esta ocupada pelo container planix-app-1 nesta maquina.
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: chess

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/chess}
    username: ${DB_USERNAME:chess}
    password: ${DB_PASSWORD:chess}

  jpa:
    # O schema pertence ao Flyway. `validate` falha o boot se as entidades
    # divergirem das migrations -- que e exatamente o que queremos saber cedo.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # HS256 exige >= 256 bits. Em producao vem de JWT_SECRET; este default
    # existe apenas para o ambiente local nao precisar de setup.
    secret: ${JWT_SECRET:dev-only-secret-nao-use-em-producao-troque-por-uma-chave-de-256-bits}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  auth:
    # Em producao (HTTPS) deve ser true.
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
