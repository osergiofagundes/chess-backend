server:
  port: ${SERVER_PORT:7777}

spring:
  application:
    name: chess

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/chess}
    username: ${DB_USERNAME:chess}
    password: ${DB_PASSWORD:chess}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-nao-use-em-producao-troque-por-uma-chave-de-256-bits}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9999}
